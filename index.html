/* Cascading Region Handlers */
function onProvChange(p, prefix='reg_'){
  const kabEl = $('#'+prefix+'kab');
  const kecEl = $('#'+prefix+'kec');
  const desEl = $('#'+prefix+'desa');
  if(!kabEl) return;
  const kabs = INDO_WILAYAH[p] ? Object.keys(INDO_WILAYAH[p]) : ['Kota/Kabupaten Lainnya'];
  kabEl.innerHTML = kabs.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');
  onKabChange(kabEl.value, prefix);
}

function onKabChange(k, prefix='reg_'){
  const provEl = $('#'+prefix+'prov');
  const kecEl = $('#'+prefix+'kec');
  const desEl = $('#'+prefix+'desa');
  if(!kecEl || !provEl) return;
  const p = provEl.value;
  const kecs = (INDO_WILAYAH[p] && INDO_WILAYAH[p][k]) ? Object.keys(INDO_WILAYAH[p][k]) : ['Kecamatan Lainnya'];
  kecEl.innerHTML = kecs.map(kc=>`<option value="${esc(kc)}">${esc(kc)}</option>`).join('');
  onKecChange(kecEl.value, prefix);
}

function onKecChange(kc, prefix='reg_'){
  const provEl = $('#'+prefix+'prov');
  const kabEl = $('#'+prefix+'kab');
  const desEl = $('#'+prefix+'desa');
  if(!desEl || !provEl || !kabEl) return;
  const p = provEl.value;
  const k = kabEl.value;
  const desas = (INDO_WILAYAH[p] && INDO_WILAYAH[p][k] && INDO_WILAYAH[p][k][kc]) ? INDO_WILAYAH[p][k][kc] : ['Kelurahan/Desa Lainnya'];
  desEl.innerHTML = desas.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('');
}

function updateLembagaField(pend, prefix='reg_'){
  const c = $('#'+prefix+'lembaga_container');
  if(!c) return;
  if(pend === 'Pesantren'){
    c.innerHTML = `
      <label>Nama Pondok Pesantren

}

function bacaRegFoto(el){
  const f = el.files[0];
  if(!f) return;
  if(f.size > 2.5 * 1024 * 1024) return toast('Ukuran foto maksimal 2.5MB', 'er');
  const reader = new FileReader();
  reader.onload = e => {
    regFotoData = e.target.result;
    const prev = $('#reg_foto_preview');
    if(prev) prev.innerHTML = `<img src="${regFotoData}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid var(--p)">`;
    toast('Foto profil berhasil diunggah');
  };
  reader.readAsDataURL(f);
}

function bacaRegBukti(el){
  const f = el.files[0];
  if(!f) return;
  if(f.size > 3 * 1024 * 1024) return toast('Ukuran bukti pembayaran maksimal 3MB', 'er');
  const reader = new FileReader();
  reader.onload = e => {
    regBuktiData = e.target.result;
    const prev = $('#reg_bukti_preview');
    if(prev) prev.innerHTML = `<img src="${regBuktiData}" style="max-height:80px;border-radius:8px;border:1px solid var(--bd);object-fit:contain">`;
    toast('Tanda bukti pembayaran berhasil diunggah');
  };
  reader.readAsDataURL(f);
}

function doRegisterSiswa(){
  const name = ($('#reg_name')?.value || '').trim();
  const pend = $('#reg_pendidikan')?.value || 'Umum';
  const pesantren = ($('#reg_pesantren')?.value || '').trim();
  const sekolah = ($('#reg_sekolah')?.value || '').trim();
  const prov = $('#reg_prov')?.value || '';
  const kab = $('#reg_kab')?.value || '';
  const kec = $('#reg_kec')?.value || '';
  const desa = $('#reg_desa')?.value || '';
  const detail = ($('#reg_detail')?.value || '').trim();
  const wa = ($('#reg_wa')?.value || '').trim();
  const belajar = $('#reg_belajar')?.value || 'Online';
  const tahunLulus = ($('#reg_tahun')?.value || '').trim();
  const user = ($('#reg_user')?.value || '').trim().toLowerCase();
  const pw = ($('#reg_pw')?.value || '').trim();

  if(!name) return toast('Nama Lengkap wajib diisi', 'er');
  if(pend === 'Pesantren' && !pesantren) return toast('Nama Pondok Pesantren wajib diisi', 'er');
  if(!sekolah) return toast('Nama SMA / MA / Setara wajib diisi', 'er');
  if(!detail) return toast('Esai alamat lembaga (RT/RW, Jalan, No) wajib diisi', 'er');
  if(!wa) return toast('Nomor WhatsApp wajib diisi', 'er');
  if(!regFotoData) return toast('Harap unggah Pas Photo Anda', 'er');
  if(!regBuktiData) return toast('Harap unggah Tanda Bukti Pembayaran', 'er');
  if(!tahunLulus) return toast('Tahun Lulus wajib diisi', 'er');
  if(!user || user.length < 3) return toast('Username minimal 3 karakter', 'er');
  if(!pw || pw.length < 4) return toast('Password minimal 4 karakter', 'er');

  if(S.stu.some(s => s.user.toLowerCase() === user || s.nis === user)){
    return toast('Username "'+user+'" sudah terdaftar. Silakan pilih username lain.', 'er');
  }

  const autoNis = '2026' + String(S.stu.length + 1).padStart(3, '0');
  const targetClass = S.classes.length ? S.classes[0].name : 'Umum';

  const newStu = {
    id: 'S' + Date.now(),
    nis: autoNis,
    nisn: '-',
    name,
    pendidikan: pend,
    pesantren: pend === 'Pesantren' ? pesantren : '',
    sekolah,
    lembagaProv: prov,
    lembagaKab: kab,
    lembagaKec: kec,
    lembagaDesa: desa,
    lembagaDetail: detail,
    alamat: `${detail}, ${desa}, ${kec}, ${kab}, ${prov}`,
    wa,
    pilihanBelajar: belajar,
    foto: regFotoData,
    buktiBayar: regBuktiData,
    tahunLulus,
    cls: targetClass,
    jk: 'L',
    ttl: '-',
    motto: 'Belajar dengan tekun dan ikhlas untuk meraih cita-cita.',
    user,
    pw: hash(pw),
    status: 'Aktif'
  };

  S.stu.push(newStu);
  sv0();
  lg('Pendaftaran siswa baru: ' + name + ' (' + user + ')');
  toast('Pendaftaran berhasil! Akun Anda telah aktif.');

  // Reset form uploads
  regFotoData = '';
  regBuktiData = '';

  // Langsung login otomatis ke portal siswa
  U = { ...newStu, role: 'siswa' };
  sTab = 'profil';
  render();
}

function renderUjianSiswa(stu, exams){
  const hasCompleted = eid => S.res.some(r => r.exam == eid && r.stu == stu.id);
  const ongoing = exams.filter(e => !hasCompleted(e.id) && (e.status == 'Aktif' || (gS()[e.id+'_'+stu.id] && gS()[e.id+'_'+stu.id].status != 'selesai')));
  const upcoming = exams.filter(e => !hasCompleted(e.id) && e.status == 'Terjadwal');
  const finished = exams.filter(e => hasCompleted(e.id) || e.status == 'Selesai');

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
      <div>
        <h2 style="margin:0">${t('courses', 'Courses')}</h2>
        <small style="opacity:.75">Daftar ujian pada NAIL TEST</small>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="b ${uFilter=='all'?'pr':''}" onclick="uFilter='all';stuView()">${t('all', 'Semua')} (${exams.length})</button>
        <button class="b ${uFilter=='ongoing'?'pr':''}" onclick="uFilter='ongoing';stuView()">⏳ ${t('next_test', 'Next Test')} (${ongoing.length})</button>
        <button class="b ${uFilter=='upcoming'?'pr':''}" onclick="uFilter='upcoming';stuView()">📅 ${t('on_going', 'On Going')} (${upcoming.length})</button>
        <button class="b ${uFilter=='finished'?'pr':''}" onclick="uFilter='finished';stuView()">✅ ${t('my_test', 'My Test')} (${finished.length})</button>
      </div>
    </div>

    <!-- Kategori 1: Next Test (Ujian Sedang Berlangsung / Akan Berakhir) -->
    ${(uFilter=='all'||uFilter=='ongoing') ? `
      <div style="margin-bottom:24px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span style="font-size:18px">⏳</span>
          <h3 style="margin:0">Next Test (${ongoing.length})</h3>
        </div>
        ${ongoing.length ? ongoing.map(e => {
          const sess = gS()[e.id+'_'+stu.id];
          const isOngoingSession = sess && sess.status != 'selesai';
          const subjName = S.subj.find(s=>s.id==e.subj)?.name || e.subj;
          return `
            <div class="card" style="border-left:5px solid var(--ok);margin-bottom:12px;background:#f0fdf4">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
                <div>
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">
                    <b style="font-size:16px">${esc(e.name)}</b>
                    <span class="bd Selesai">${esc(subjName)}</span>
                    <span class="bd Aktif">${isOngoingSession ? 'Sesi Sedang Berjalan' : 'Tersedia Sekarang'}</span>
                  </div>
                  <p style="margin:0;font-size:13px;opacity:.9">
                    📅 Tanggal: <b>${esc(e.date)}</b> · Batas Waktu: <b>${esc(e.start)} – ${esc(e.end)} WIB</b><br>
                    ⏱ Durasi: <b>${e.dur} menit</b> · 📝 Jumlah Soal: <b>${e.qids.length} butir</b> · 🛡 Maksimal Pelanggaran: <b>${e.maxV}x</b>
                  </p>
                  <p style="margin:6px 0 0;font-size:12px;color:var(--p)">
                    <b>Info Akses:</b> Token Ujian: <code>${esc(e.token)}</code> · Kode Akses Anda: <code>${cardCode(e, stu)}</code>
                  </p>
                </div>
                <div>
                  <button class="b pr" style="padding:10px 18px;font-weight:700" onclick="vf('${e.id}')">
                    ${isOngoingSession ? '▶ Lanjutkan Ujian' : '✔ Verifikasi &amp; Mulai Ujian'}
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('') : `
          <div class="card" style="opacity:.7;padding:16px;text-align:center">
            Tidak ada ujian yang sedang berlangsung saat ini untuk kelas Anda.
          </div>
        `}
      </div>
    ` : ''}

    <!-- Kategori 2: On Going (Ujian yang Akan Dilangsungkan) -->
    ${(uFilter=='all'||uFilter=='upcoming') ? `
      <div style="margin-bottom:24px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span style="font-size:18px">📅</span>
          <h3 style="margin:0">On Going (${upcoming.length})</h3>
        </div>
        ${upcoming.length ? upcoming.map(e => {
          const subjName = S.subj.find(s=>s.id==e.subj)?.name || e.subj;
          return `
            <div class="card" style="border-left:5px solid var(--wn);margin-bottom:12px">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
                <div>
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">
                    <b style="font-size:16px">${esc(e.name)}</b>
                    <span class="bd Selesai">${esc(subjName)}</span>
                    <span class="bd Terjadwal">Akan Dilangsungkan</span>
                  </div>
                  <p style="margin:0;font-size:13px;opacity:.9">
                    📅 Jadwal Pelaksanaan: <b>${esc(e.date)}</b> pukul <b>${esc(e.start)} – ${esc(e.end)} WIB</b><br>
                    ⏱ Alokasi Durasi: <b>${e.dur} menit</b> · 📝 Butir Soal: <b>${e.qids.length} soal</b> · Pengampu: <b>${esc(teacherOf(e.teacher))}</b>
                  </p>
                  <p style="margin:6px 0 0;font-size:12px;opacity:.75">
                    ℹ Ujian akan dibuka dan dapat diakses ketika jadwal telah tiba sesuai instruksi pengawas/guru.
                  </p>
                </div>
                <div>
                  <button class="b" disabled style="opacity:.6">Belum Dibuka</button>
                </div>
              </div>
            </div>
          `;
        }).join('') : `
          <div class="card" style="opacity:.7;padding:16px;text-align:center">
            Tidak ada jadwal ujian mendatang yang terdaftar saat ini.
          </div>
        `}
      </div>
    ` : ''}

    <!-- Kategori 3: My Test (Ujian yang Telah Diikuti) -->
    ${(uFilter=='all'||uFilter=='finished') ? `
      <div style="margin-bottom:24px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span style="font-size:18px">✅</span>
          <h3 style="margin:0">My Test (${finished.length})</h3>
        </div>
        ${finished.length ? finished.map(e => {
          const res = S.res.find(r => r.exam == e.id && r.stu == stu.id);
          const subjObj = S.subj.find(s=>s.id==e.subj);
          const subjName = subjObj?.name || e.subj;
          const kkm = subjObj?.kkm || S.school.kkm || 70;
          const score = res ? res.score : null;
          const isPassed = score !== null && score >= kkm;

          return `
            <div class="card" style="border-left:5px solid var(--s);margin-bottom:12px">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
                <div>
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">
                    <b style="font-size:16px">${esc(e.name)}</b>
                    <span class="bd Selesai">${esc(subjName)}</span>
                    <span class="bd" style="background:#0284c7">Selesai Dikerjakan</span>
                    ${score !== null ? `<span class="bd ${isPassed?'Aktif':'Diblokir'}">${isPassed?'Tuntas':'Belum Tuntas'}</span>` : ''}
                  </div>
                  <p style="margin:0;font-size:13px;opacity:.9">
                    📅 Tanggal Ujian: <b>${esc(e.date)}</b> ${res ? `· Dikumpulkan: <b>${esc(res.at)}</b>` : ''}<br>
                    ${score !== null ? `Nilai Akhir: <b style="font-size:18px;color:${isPassed?'var(--ok)':'var(--er)'}">${score}</b> / 100 &nbsp;·&nbsp; Standar KKM: <b>${kkm}</b>` : 'Menunggu publikasi hasil penilaian'}
                  </p>
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                  ${res ? `
                    <button class="b pr" onclick="modalHasilPDF('${res.id}')">📑 Buka Pembahasan</button>
                    <button class="b" onclick="cetakHasilPDF('${res.id}')">🖨️ Download PDF</button>
                  ` : `<span style="font-size:12px;opacity:.7">Belum ada nilai tersimpan</span>`}
                </div>
              </div>
            </div>
          `;
        }).join('') : `
          <div class="card" style="opacity:.7;padding:16px;text-align:center">
            Anda belum mengikuti ujian apa pun.
          </div>
        `}
      </div>
    ` : ''}
  `;
}

/* 2. TAMPILAN PROFIL SISWA (LENGKAP SESUAI FORMULIR PENDAFTARAN) */

  const teachersList = [];
  const teacherIds = new Set();
  
  if(curClass && curClass.wali) teacherIds.add(curClass.wali);
  mySubjects.forEach(s => { if(s.teacher) teacherIds.add(s.teacher); });
  teacherIds.forEach(tid => {
    const g = S.users.find(u => u.id == tid && u.role == 'guru');

      <!-- Card: Guru yang Mengajar -->

        <h3 style="margin-top:0">👨‍🏫 Guru Pengajar Kelas ${esc(stu.cls)}</h3>
        <p style="font-size:12px;opacity:.75;margin-bottom:10px">Tenaga pendidik yang mengampu mata pelajaran di kelas ini:</p>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${teachersList.map(g => {
            const mapelG = S.subj.filter(s=>s.teacher==g.id).map(s=>s.name).join(', ')||'-';
            const isWali = curClass?.wali == g.id;
            return `
              <div style="padding:10px 14px;background:#F8FAFC;border:1px solid var(--bd);border-radius:12px;display:flex;gap:12px;align-items:center">

                <div style="flex:1;min-width:0">
                  <div style="display:flex;align-items:center;gap:6px">

                    ${isWali ? '<span class="bd Aktif" style="font-size:10px">Wali Kelas</span>' : ''}

                  <div style="font-size:12px;opacity:.8">Mengampu: <b>${esc(mapelG)}</b></div>
                  <div style="font-size:11px;opacity:.65">✉ ${esc(g.email||'-')} · NIP: ${esc(g.nip||'-')}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

/* 3. TAMPILAN HASIL UJIAN & DOWNLOAD PDF SISWA */
function renderHasilSiswa(stu, results){
  const total = results.length;
  const avg = total ? Math.round(results.reduce((a,b)=>a+b.score,0)/total) : 0;
  const max = total ? Math.max(...results.map(r=>r.score)) : 0;
  const passed = results.filter(r => r.score >= (S.subj.find(s=>s.id==exOf(r.exam)?.subj)?.kkm || S.school.kkm || 70)).length;

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
      <div>
        <h2 style="margin:0">Result</h2>
        <small style="opacity:.75">Lembar evaluasi nilai, analisis butir soal, kunci jawaban yang benar, pembahasan materi, dan download PDF</small>
      </div>
    </div>

    <!-- Ringkasan Nilai Siswa -->
    <div class="g" style="margin-bottom:18px">
      <div class="card st">Total Ujian Diikuti<b>${total}</b></div>
      <div class="card st">Rata-rata Nilai<b>${avg}</b></div>
      <div class="card st">Nilai Tertinggi<b>${max}</b></div>
      <div class="card st">Ketuntasan (KKM)<b>${total ? Math.round(passed/total*100) : 0}% (${passed}/${total})</b></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">📑 Riwayat Hasil &amp; Lembar Pembahasan</h3>
      ${results.length ? `
        <div style="display:flex;flex-direction:column;gap:12px">
          ${results.map(r => {
            const ex = exOf(r.exam);
            const subjObj = S.subj.find(s=>s.id==ex.subj);
            const kkm = subjObj?.kkm || S.school.kkm || 70;
            const isPassed = r.score >= kkm;
            return `
              <div style="padding:14px;background:#F8FAFC;border:1px solid var(--bd);border-radius:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
                <div>
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">
                    <b style="font-size:16px">${esc(ex.name)}</b>
                    <span class="bd Selesai">${esc(subjObj?.name || ex.subj)}</span>
                    <span class="bd ${isPassed?'Aktif':'Diblokir'}">${isPassed?'Tuntas':'Belum Tuntas'}</span>
                  </div>
                  <div style="font-size:13px;opacity:.85">
                    Waktu Pengerjaan: <b>${esc(r.at)}</b> · Guru Pengampu: <b>${esc(teacherOf(ex.teacher))}</b><br>
                    Standar KKM: <b>${kkm}</b> · Pelanggaran Terdeteksi: <b>${r.v||0}x</b>
                  </div>
                </div>

                <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
                  <div style="text-align:right">
                    <small style="opacity:.7">Nilai Akhir</small>
                    <div style="font-size:24px;font-weight:800;color:${isPassed?'var(--ok)':'var(--er)'}">${r.score}</div>
                  </div>
                  <div style="display:flex;gap:6px;flex-direction:column">
                    <button class="b pr" style="font-size:12px;padding:8px 14px" onclick="modalHasilPDF('${r.id}')">📑 Buka Pembahasan</button>
                    <button class="b" style="font-size:12px;padding:8px 14px" onclick="cetakHasilPDF('${r.id}')">🖨️ Download PDF / Cetak</button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      ` : `
        <div style="text-align:center;padding:24px;opacity:.7">
          Belum ada riwayat hasil ujian yang diselesaikan.
        </div>
      `}
    </div>
  `;
}

function simpanEditProfilSiswa(){
  const s = S.stu.find(x => x.id == U.id) || U;
  const name = ($('#ep_name')?.value || '').trim();
  const pend = $('#ep_pendidikan')?.value || 'Umum';
  const pesantren = ($('#ep_pesantren')?.value || '').trim();
  const sekolah = ($('#ep_sekolah')?.value || '').trim();
  const prov = $('#ep_prov')?.value || '';
  const kab = $('#ep_kab')?.value || '';
  const kec = $('#ep_kec')?.value || '';
  const desa = $('#ep_desa')?.value || '';
  const detail = ($('#ep_detail')?.value || '').trim();
  const wa = ($('#ep_wa')?.value || '').trim();
  const belajar = $('#ep_belajar')?.value || 'Online';
  const tahunLulus = ($('#ep_tahun')?.value || '').trim();
  const motto = ($('#ep_motto')?.value || '').trim();
  const user = ($('#ep_user')?.value || '').trim().toLowerCase();
  const pw = ($('#ep_pw')?.value || '').trim();

  if(!name) return toast('Nama Lengkap wajib diisi', 'er');
  if(pend === 'Pesantren' && !pesantren) return toast('Nama Pondok Pesantren wajib diisi', 'er');
  if(!sekolah) return toast('Nama SMA / MA / Setara wajib diisi', 'er');
  if(!wa) return toast('Nomor WhatsApp wajib diisi', 'er');
  if(!user) return toast('Username wajib diisi', 'er');

  if(S.stu.some(x => x.user.toLowerCase() === user && x.id !== s.id)){
    return toast('Username "'+user+'" sudah digunakan oleh siswa lain', 'er');
  }

  s.name = name;
  s.pendidikan = pend;
  s.pesantren = pend === 'Pesantren' ? pesantren : '';
  s.sekolah = sekolah;
  s.lembagaProv = prov;
  s.lembagaKab = kab;
  s.lembagaKec = kec;
  s.lembagaDesa = desa;
  s.lembagaDetail = detail;
  s.alamat = detail ? `${detail}, ${desa}, ${kec}, ${kab}, ${prov}` : s.alamat;
  s.wa = wa;
  s.pilihanBelajar = belajar;
  s.tahunLulus = tahunLulus;
  s.motto = motto;
  s.user = user;

  if(pw){
    s.pw = hash(pw);
    U.pw = s.pw;
  }

  Object.assign(U, s);
  sv0();
  lg('Perbarui profil siswa ' + s.name);
  toast('Profil siswa berhasil diperbarui!');
  mo();
  stuView();
}

function uploadFotoSiswa(el){
  const file = el.files[0];
  if(!file) return;
  if(file.size > 2.5 * 1024 * 1024) return toast('Ukuran foto maksimal 2.5MB', 'er');
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    const s = S.stu.find(x => x.id == U.id);
    if(s){
      s.foto = dataUrl;
      U.foto = dataUrl;
      sv0();
      toast('Foto profil siswa berhasil diperbarui!');
      stuView();
    }
  };
  reader.readAsDataURL(file);
}

function uploadBuktiBayarSiswa(el){
  const file = el.files[0];
  if(!file) return;
  if(file.size > 3 * 1024 * 1024) return toast('Ukuran bukti pembayaran maksimal 3MB', 'er');
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    const s = S.stu.find(x => x.id == U.id);
    if(s){
      s.buktiBayar = dataUrl;
      U.buktiBayar = dataUrl;
      sv0();
      toast('Tanda bukti pembayaran berhasil diperbarui!');
      stuView();
    }
  };
  reader.readAsDataURL(file);
}

function hapusFotoSiswa(){
  ask('Hapus foto profil siswa saat ini?', ()=>{
    const s = S.stu.find(x => x.id == U.id);
    if(s){
      s.foto = '';
      U.foto = '';
      sv0();
      toast('Foto profil dihapus');
      stuView();
    }
  });
}

/* PEMBUATAN LAPORAN HASIL UJIAN DALAM FORMAT PDF BESERTA PEMBAHASAN */
function generateHasilPrintHTML(r, ex, st, qList){
  const subjObj = S.subj.find(s=>s.id==ex.subj);
  const kkm = subjObj?.kkm || S.school.kkm || 70;
  const isPassed = r.score >= kkm;
  const tuntasLabel = isPassed ? 'TUNTAS (MEMENUHI KKM)' : 'BELUM TUNTAS (DI BAWAH KKM)';
  const tuntasColor = isPassed ? '#16A34A' : '#DC2626';

  let qRows = '';
  qList.forEach((q, idx) => {
    const userAns = r.ans ? r.ans[q.id] : undefined;
    const isCorrect = r.resp && r.resp[q.id] >= 1;
    let detailAns = '';

    if(q.type == 'pg'){
      const userChoiceStr = userAns !== undefined && q.opts[userAns] ? `${String.fromCharCode(65+userAns)}. ${esc(q.opts[userAns])}` : '<i style="color:#dc2626">(Tidak dijawab)</i>';
      const keyChoiceStr = q.opts[q.key] !== undefined ? `${String.fromCharCode(65+q.key)}. ${esc(q.opts[q.key])}` : '-';
      detailAns = `
        <div style="margin:8px 0;font-size:13px">
          <b>Pilihan Opsi Jawaban:</b>
          <div style="margin:4px 0 8px 10px">
            ${q.opts.map((opt, oi)=>{
              const isUser = userAns === oi;
              const isKey = q.key === oi;
              let bg = '#fff';
              let border = '#cbd5e1';
              let badge = '';
              if(isUser && isCorrect){ bg = '#ecfdf5'; border = '#10b981'; badge = ' <span style="color:#16a34a;font-weight:700">✔ (Jawaban Siswa - TEPAT)</span>'; }
              else if(isUser && !isCorrect){ bg = '#fef2f2'; border = '#ef4444'; badge = ' <span style="color:#dc2626;font-weight:700">✖ (Jawaban Siswa - SALAH)</span>'; }
              else if(isKey){ bg = '#f0fdf4'; border = '#86efac'; badge = ' <span style="color:#15803d;font-weight:600">✔ (Kunci Benar)</span>'; }
              return `<div style="padding:4px 10px;margin:3px 0;background:${bg};border:1px solid ${border};border-radius:6px">${String.fromCharCode(65+oi)}. ${esc(opt)}${badge}</div>`;
            }).join('')}
          </div>
          <div style="padding:4px 0">
            Jawaban yang Dipilih Siswa: <b>${userChoiceStr}</b> &nbsp;|&nbsp; 
            Kunci Jawaban yang Benar: <b style="color:#16a34a">${keyChoiceStr}</b>
          </div>
        </div>
      `;
    } else if(q.type == 'kompleks'){
      const userArr = Array.isArray(userAns) ? userAns : [];
      const userChoiceStr = userArr.length ? userArr.map(x=>`${String.fromCharCode(65+x)}. ${esc(q.opts[x])}`).join('; ') : '<i style="color:#dc2626">(Tidak dijawab)</i>';
      const keyChoiceStr = q.key.map(x=>`${String.fromCharCode(65+x)}. ${esc(q.opts[x])}`).join('; ');
      detailAns = `
        <div style="margin:8px 0;font-size:13px">
          <div>Jawaban Siswa: <b>${userChoiceStr}</b></div>
          <div>Kunci Jawaban Benar: <b style="color:#16a34a">${keyChoiceStr}</b></div>
        </div>
      `;
    } else if(q.type == 'bs'){
      const userArr = Array.isArray(userAns) ? userAns : [];
      detailAns = `
        <div style="margin:8px 0;font-size:13px">
          <table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:4px">
            <tr style="background:#f1f5f9;text-align:left"><th style="padding:5px 8px;border:1px solid #cbd5e1">Pernyataan</th><th style="padding:5px 8px;border:1px solid #cbd5e1">Jawaban Siswa</th><th style="padding:5px 8px;border:1px solid #cbd5e1">Kunci Benar</th></tr>
            ${q.opts.map((opt, oi)=>`
              <tr>
                <td style="padding:5px 8px;border:1px solid #cbd5e1">${esc(opt)}</td>
                <td style="padding:5px 8px;border:1px solid #cbd5e1">${userArr[oi]===true?'Benar':userArr[oi]===false?'Salah':'(Kosong)'}</td>
                <td style="padding:5px 8px;border:1px solid #cbd5e1;font-weight:700;color:#16a34a">${q.key[oi]?'Benar':'Salah'}</td>
              </tr>
            `).join('')}
          </table>
        </div>
      `;
    } else {
      detailAns = `
        <div style="margin:8px 0;font-size:13px">
          <div><b>Jawaban Siswa (Esai):</b><br><blockquote style="margin:4px 0;padding:8px 12px;background:#f8fafc;border-left:3px solid #6437F2;border-radius:4px">${esc(userAns||'(Tidak dijawab)')}</blockquote></div>
        </div>
      `;
    }

    qRows += `
      <div style="border:1px solid #cbd5e1;border-radius:10px;padding:14px;margin-bottom:14px;page-break-inside:avoid;background:#fff">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-weight:700;font-size:14px">Soal No. ${idx+1} <small style="font-weight:normal;color:#64748b">(${TP[q.type]} · Bobot ${q.w})</small></span>
          <span style="padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;background:${isCorrect?'#16a34a':'#dc2626'}">${isCorrect?'✔ BENAR':'✖ SALAH'}</span>
        </div>
        <p style="margin:0 0 8px;font-size:14px;line-height:1.5">${esc(q.text)}</p>
        ${detailAns}
        <div style="margin-top:10px;padding:10px 14px;background:#f8fafc;border-left:4px solid #6437F2;border-radius:6px;font-size:12px;color:#334155">
          <b style="color:#6437F2">💡 Penjelasan / Pembahasan Soal:</b><br>
          ${esc(q.exp || ('Pembahasan untuk kompetensi ' + q.subj + ': Kunci materi ini menguji penguasaan konsep ' + esc(q.text.slice(0, 50)) + '...'))}
        </div>
      </div>
    `;
  });

  return `
    <div class="pdf-report" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#1e293b;max-width:850px;margin:auto;padding:10px">
      <!-- KOP RESMI SEKOLAH -->
      <div style="display:flex;align-items:center;border-bottom:3px double #0f172a;padding-bottom:12px;margin-bottom:18px">
        <div style="width:64px;height:64px;background:#6437F2;color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin-right:16px;flex-shrink:0">✦</div>
        <div style="flex:1">
          <h2 style="margin:0;font-size:20px;text-transform:uppercase;letter-spacing:.5px;color:#0f172a">${esc(S.school.name)}</h2>
          <p style="margin:2px 0 0;font-size:12px;color:#475569">${esc(S.school.addr)} · Telp: ${esc(S.school.tel)} · Email: ${esc(S.school.email)}</p>
          <p style="margin:2px 0 0;font-size:11px;color:#64748b;font-weight:600">LEMBAR HASIL UJIAN COMPUTER BASED TEST (CBT)</p>
        </div>
      </div>

      <div style="text-align:center;margin-bottom:18px">
        <h3 style="margin:0;font-size:17px;text-transform:uppercase;letter-spacing:.5px">LAPORAN HASIL &amp; PEMBAHASAN UJIAN</h3>
        <p style="margin:4px 0 0;font-size:12px;color:#64748b">Dokumen Evaluasi Capaian Pembelajaran Siswa Terpadu</p>
      </div>

      <!-- BIODATA SISWA & UJIAN -->
      <div style="background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:14px;margin-bottom:20px;font-size:13px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <table style="width:100%;border-collapse:collapse">
              <tr><td style="width:110px;padding:3px 0;color:#64748b">Nama Siswa</td><td style="padding:3px 0">: <b>${esc(st.name)}</b></td></tr>
              <tr><td style="padding:3px 0;color:#64748b">NIS / NISN</td><td style="padding:3px 0">: ${esc(st.nis)} / ${esc(st.nisn||'-')}</td></tr>
              <tr><td style="padding:3px 0;color:#64748b">Kelas / Ruang</td><td style="padding:3px 0">: <b>${esc(st.cls)}</b></td></tr>

            </table>

          <div>

              <tr><td style="width:110px;padding:3px 0;color:#64748b">Mata Pelajaran</td><td style="padding:3px 0">: <b>${esc(subjObj?.name||ex.subj)} (${esc(ex.subj)})</b></td></tr>

function vf(eid){
  const e=exOf(eid);if(gS()[eid+'_'+U.id])return startExam(eid);
  frm('Verifikasi Kehadiran',[{k:'c',l:'Kode Card Peserta Ujian',req:1},{k:'t',l:'Token Ujian',req:1}],v=>{
    if(v.c.trim().toUpperCase()!=cardCode(e,U))return'Kode Card peserta tidak sesuai dengan kartu ujian Anda.';
    if(v.t.trim().toUpperCase()!=e.token.toUpperCase())return'Token ujian salah atau belum valid.';
    S.att[eid+'_'+U.id]=new Date().toLocaleTimeString();
    sv0();
    setTimeout(()=>startExam(eid),50);
  });
}

function startExam(eid){
  const ex=exOf(eid),k=eid+'_'+U.id,all=gS();let re=!!all[k];
  if(!all[k]){
    const seed=Math.floor(Math.random()*1e9),r=rng(seed),oo={};
    ex.qids.forEach(id=>{const q=qOf(id);if(ex.so&&q.opts.length)oo[id]=shuf(q.opts.map((_,i)=>i),r)});
    all[k]={exam:eid,stu:U.id,seed,order:ex.sq?shuf(ex.qids,r):[...ex.qids],oo,start:Date.now(),extra:0,ans:{},flag:{},fail:{},viol:[],warned:[],status:'aktif',last:Date.now()};
    sS(all);lg('Mulai ujian '+eid);
  }
  X={ex,k,cur:0,lv:0,bl:false};X.tm=setInterval(tick,1000);
  if(re)viol('Sesi dilanjutkan / halaman dimuat ulang',false);
  exRender();
}

function upd(f){const all=gS(),s=all[X.k];if(!s)return;f(s);sS(all);ind(navigator.onLine?'✔ Tersimpan '+new Date().toLocaleTimeString():'⚠ Offline — tersimpan lokal')}
const ind=m=>{const e=$('#ind');if(e)e.textContent=m};

function exRender(){
  if(!X)return;const s=gS()[X.k],ex=X.ex,q=qOf(s.order[X.cur]),a=s.ans[q.id],oo=s.oo[q.id]||q.opts.map((_,i)=>i);let body='';
  if(q.type=='pg')body=oo.map((o,i)=>`<label class="op ${a===o?'sel':''}"><input type=radio name=o ${a===o?'checked':''} onchange="an(${o})"> ${String.fromCharCode(65+i)}. ${esc(q.opts[o])}</label>`).join('');
  else if(q.type=='kompleks')body='<i>Pilih satu atau lebih jawaban</i>'+oo.map((o,i)=>`<label class="op ${a&&a.includes(o)?'sel':''}"><input type=checkbox ${a&&a.includes(o)?'checked':''} onchange="ak(${o})"> ${String.fromCharCode(65+i)}. ${esc(q.opts[o])}</label>`).join('');
  else if(q.type=='bs')body=oo.map(o=>`<div class=op>${esc(q.opts[o])}<br><label style="display:inline"><input type=radio name=b${o} ${a&&a[o]===true?'checked':''} onchange="ab(${o},true)"> Benar</label> &nbsp; <label style="display:inline"><input type=radio name=b${o} ${a&&a[o]===false?'checked':''} onchange="ab(${o},false)"> Salah</label></div>`).join('');
  else body=`<textarea class=in rows=10 oninput="ae(this.value)" placeholder="Tulis jawaban esai (tersimpan otomatis)">${esc(a||'')}</textarea>`;
  const ans=ex.qids.filter(id=>isA(qOf(id),s.ans[id])).length;
  $('#app').innerHTML=`<header><b>${esc(S.school.name)}</b> · ${esc(ex.name)} · ${esc(U.name)} (${esc(U.nis)})<span style=flex:1></span>⏱ <b id=tmr style="font-size:20px">${fmt(s.start+(ex.dur+s.extra)*60000-Date.now())}</b></header>
  <div style="padding:14px;max-width:1000px;margin:auto">
    <div class=card style="border-left:4px solid var(--wn);font-size:12px">Mode browser: pengawasan deteksi aktivitas. Pelanggaran: ${s.viol.filter(v=>v.c).length}/${ex.maxV}</div>
    <div class=ex>
      <div class=card>
        <b>Soal ${X.cur+1} dari ${s.order.length}</b> · ${q.type=='pg'?'Pilihan Ganda':q.type=='kompleks'?'PG Kompleks':q.type=='bs'?'Benar/Salah':'Esai'} · bobot ${q.w}
        <p style="font-size:16px">${esc(q.text)}</p>${body}
        <div style="margin-top:12px">
          <button class=b ${X.cur<1?'disabled':''} onclick="mv(-1)">‹ Sebelumnya</button>
          <button class=b style="background:var(--wn);color:#000" onclick="fl()">${s.flag[q.id]?'✔ Ragu-ragu':'Ragu-ragu'}</button>
          <button class=b onclick="upd(()=>{});toast('Jawaban disimpan')">Simpan</button>
          <button class=b ${X.cur>=s.order.length-1?'disabled':''} onclick="mv(1)">Selanjutnya ›</button>
          <button class="b er" onclick="fin0()">Selesai Ujian</button>
        </div>
        <p id=ind style="font-size:12px;opacity:.7">Auto-save aktif</p>
      </div>
      <div class=card>
        <b>Navigasi (${ans}/${s.order.length} terjawab)</b>
        <div class=nv style="margin-top:8px">${s.order.map((id,i)=>`<button class="${i==X.cur?'cur':s.fail[id]?'bad':s.flag[id]?'fl':isA(qOf(id),s.ans[id])?'an':''}" onclick="X.cur=${i};exRender()">${i+1}</button>`).join('')}</div>
        <p style="font-size:11px;margin-top:8px">⬜ belum · 🟩 dijawab · 🟨 ragu · 🟦 aktif</p>
      </div>
    </div>
  </div>
  ${s.status=='diblokir'?'<div style="position:fixed;inset:0;background:#000d;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;z-index:40;padding:20px"><div><h2>⛔ Ujian diblokir</h2><p>Batas pelanggaran tercapai. Hubungi pengawas untuk membuka blokir.</p></div></div>':''}`;
}

const cq=()=>gS()[X.k].order[X.cur],mv=d=>{X.cur=Math.max(0,Math.min(X.cur+d,X.ex.qids.length-1));exRender()};
const A=f=>{const id=cq();upd(s=>{f(s,id);if(!navigator.onLine)s.fail[id]=1});exRender()};
const an=o=>A((s,id)=>s.ans[id]=o),ak=o=>A((s,id)=>{const a=s.ans[id]||[];s.ans[id]=a.includes(o)?a.filter(x=>x!=o):[...a,o]}),ab=(o,v)=>A((s,id)=>{const a=s.ans[id]||[];a[o]=v;s.ans[id]=a}),fl=()=>A((s,id)=>s.flag[id]=!s.flag[id]);
const ae=v=>{const id=cq();upd(s=>s.ans[id]=v)};

function tick(){
  if(!X)return;const s=gS()[X.k];if(!s||s.status=='selesai')return;
  const rem=s.start+(X.ex.dur+s.extra)*60000-Date.now();
  [15,5,1].forEach(m=>{if(rem<=m*60000&&!s.warned.includes(m)){upd(z=>z.warned.push(m));toast('⏰ Sisa waktu '+m+' menit','er')}});
  if(rem<=0)return doSubmit(true);
  X.n=(X.n||0)+1;if(X.n%3==0)upd(z=>z.last=Date.now());
  const bl=s.status=='diblokir';if(bl!=X.bl){X.bl=bl;exRender()}
  const t=$('#tmr');if(t)t.textContent=fmt(rem);
}

function viol(t,c=true){
  if(!X)return;const s0=gS()[X.k];if(!s0||s0.status=='selesai'||(c&&s0.status=='diblokir'))return;
  const now=Date.now();if(c){if(now-X.lv<1500)return;X.lv=now}let n=0;const mx=X.ex.maxV;
  upd(s=>{s.viol.push({t:now,type:t,c});n=s.viol.filter(v=>v.c).length;if(c)s.status=n>=mx?'diblokir':'peringatan'});
  if(c){if(n>=mx)exRender();else mo(`<h3>⚠ Peringatan ${n}/${mx}</h3><p>${esc(t)}. Pelanggaran ke-${mx} akan memblokir ujian Anda.</p><button class="b pr" onclick="mo()">Mengerti</button>`)}
}

function fin0(){
  const s=gS()[X.k],ex=X.ex,a=ex.qids.filter(id=>isA(qOf(id),s.ans[id])).length;
  mo(`<h3>Akhiri ujian?</h3><p>Terjawab: <b>${a}</b> · Belum dijawab: <b>${ex.qids.length-a}</b> · Ragu-ragu: ${Object.values(s.flag).filter(Boolean).length}</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class=b onclick="mo()">Kembali</button> <button class="b er" onclick="mo();doSubmit(false)">Kumpulkan Jawaban</button></div>`);

function doSubmit(auto){
  if(!X)return;const all=gS(),s=all[X.k],ex=X.ex;if(s.status=='selesai')return;
  clearInterval(X.tm);let a=0,t=0;const resp={};
  ex.qids.forEach(id=>{const q=qOf(id),g=grade(q,s.ans[id]);if(g===null)return;resp[id]=g;a+=g*q.w;t+=q.w});
  S=JSON.parse(localStorage.getItem(LS));const sc=Math.round(a/t*100);
  const studentAns = JSON.parse(JSON.stringify(s.ans||{}));
  const newRes = {id:'R'+Date.now(),exam:ex.id,stu:U.id,score:sc,resp,ans:studentAns,at:new Date().toLocaleString('id-ID'),v:s.viol.filter(v=>v.c).length};
  S.res.push(newRes);
  sv0();
  s.status='selesai';s.end=Date.now();sS(all);X=null;mo();
  $('#app').innerHTML=`<div class=lg2 style="display:flex;align-items:center;justify-content:center"><div class="card" style="text-align:center;max-width:480px;width:90%;padding:32px"><h2>✔ Ujian Selesai</h2><p>${auto?'Waktu pengerjaan telah habis. Jawaban Anda berhasil dikumpulkan secara otomatis.':'Seluruh jawaban Anda telah berhasil disimpan dan dikumpulkan ke sistem.'}</p>${ex.showRes?`<p>Nilai Akhir: <b style="font-size:36px;color:var(--p)">${sc}</b> / 100</p>`:''}<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px"><button class="b pr" onclick="sTab='ujian';stuView()">Kembali ke Courses</button><button class="b" onclick="sTab='hasil';stuView();modalHasilPDF('${newRes.id}')">📑 Buka Result &amp; Download PDF</button></div></div></div>`;
}

function uploadFotoGuru(el){
  const file = el.files[0];
  if(!file) return;
  if(file.size > 2 * 1024 * 1024) return toast('Ukuran foto maksimal 2MB', 'er');
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    const g = S.users.find(u => u.id == U.id);
    if(g){
      g.foto = dataUrl;
      U.foto = dataUrl;
      sv0();
      toast('Foto profil berhasil diperbarui');
      staffView();
    }
  };
  reader.readAsDataURL(file);
}

function hapusFotoGuru(){
  ask('Hapus foto profil saat ini?', ()=>{

}

function sf(id){
  if(!adm())return;
  const o=id?stuOf(id):{name:'',nis:'',nisn:'',cls:S.cls[0]||'X-A',jk:'L',ttl:'',alamat:'',status:'Aktif'};
  frm(id?'Edit Data Siswa':'Tambah Siswa Baru',[
    {k:'name',l:'Nama Lengkap Siswa',v:o.name,req:1},
    {k:'nis',l:'NIS (Nomor Induk Siswa)',v:o.nis,req:1},
    {k:'nisn',l:'NISN',v:o.nisn},
    {k:'cls',l:'Kelas',t:'select',o:S.cls,v:o.cls},
    {k:'jk',l:'Jenis Kelamin',t:'select',o:['L','P'],v:o.jk},
    {k:'ttl',l:'Tempat, Tanggal Lahir',v:o.ttl},
    {k:'alamat',l:'Alamat',v:o.alamat},
    {k:'status',l:'Status',t:'select',o:['Aktif','Nonaktif'],v:o.status}
  ],v=>{
    if(!/^\d{3,12}$/.test(v.nis))return'NIS harus angka 3-12 digit';
    if(S.stu.some(s=>s.nis==v.nis&&s.id!=id))return'NIS sudah digunakan oleh siswa lain';
    if(id){
      Object.assign(S.stu.find(s=>s.id==id),v);
    }else{
      S.stu.push({...v,id:'S'+Date.now(),user:v.nis,pw:hash('siswa123')});
    }
    sv0();
    lg((id?'Edit':'Tambah')+' siswa '+v.nis);
    toast('Data siswa berhasil disimpan');
    go('master');
  });
}

const sd=id=>{
  if(!adm())return;
  const s=stuOf(id);
  ask(`Hapus data siswa <b>${esc(s.name)} (NIS: ${s.nis})</b>?`,()=>{
    S.stu=S.stu.filter(x=>x.id!=id);
    sv0();
    lg('Hapus siswa '+id);
    toast('Siswa berhasil dihapus');
    go('master');
  });
};

function imc(el){
  if(!adm())return;
  el.files[0].text().then(t=>{
    let n=0;
    t.split(/\r?\n/).forEach(l=>{
      const[a,b,c]=l.split(',').map(x=>x.replace(/"/g,'').trim());
      if(a&&/^\d{3,12}$/.test(b||'')&&S.cls.includes(c)&&!S.stu.some(s=>s.nis==b)){
        S.stu.push({id:'S'+Date.now()+n,nis:b,nisn:'',name:a,cls:c,jk:'L',ttl:'',alamat:'',user:b,pw:hash('siswa123'),status:'Aktif'});
        n++;
      }
    });
    sv0();lg('Import CSV siswa '+n);toast(n+' siswa berhasil diimpor');go('master');
  });
}

function parseCSVLine(line, delim){
  const res=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c=='"'||c=="'"){
      if(inQ && line[i+1]==c){cur+=c;i++;}else{inQ=!inQ;}
    }else if(c===delim && !inQ){
      res.push(cur.trim());cur='';
    }else{
      cur+=c;
    }
  }
  res.push(cur.trim());
  return res;
}

function importSoalBulk(text, defaultSubj){
  let lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return 0;
  let delim = '\t';
  if(!lines[0].includes('\t')){
    delim = lines[0].includes(';') ? ';' : ',';
  }
  // Cek apakah baris pertama header
  const first = lines[0].toLowerCase();
  if(first.startsWith('no')||first.startsWith('mapel')||first.startsWith('tipe')||first.startsWith('"no"')){
    lines = lines.slice(1);
  }
  let count = 0;
  lines.forEach(line=>{
    const cols = parseCSVLine(line, delim);
    if(cols.length < 4) return;
    // Format: No, Mapel, Tipe, Soal, OpsiA, OpsiB, OpsiC, OpsiD, Kunci, Kesulitan, Bobot, Pembahasan
    let mapel = cols[1] ? cols[1].toUpperCase().trim() : defaultSubj;
    if(!mine().includes(mapel)) mapel = defaultSubj;
    let type = (cols[2]||'pg').toLowerCase().trim();
    let qText = cols[3];
    let opA = cols[4]||'', opB = cols[5]||'', opC = cols[6]||'', opD = cols[7]||'';
    let keyRaw = cols[8]||'A';
    let diff = cols[9]||'Sedang';
    let weight = +cols[10]||1;
    let exp = cols[11]||'';

    let opts = [opA, opB, opC, opD].filter(x=>x && x.trim()!=='');
    let key = 0;
    if(type=='pg'){
      const kUpper = String(keyRaw).trim().toUpperCase();
      if(['A','B','C','D','E'].includes(kUpper)){
        key = kUpper.charCodeAt(0) - 65;
      } else {
        key = +keyRaw || 0;
      }
      if(key >= opts.length) key = 0;
    } else if(type=='kompleks'){
      key = String(keyRaw).split(/[,;]/).map(x=>{
        let u=x.trim().toUpperCase();
        return ['A','B','C','D','E'].includes(u)?u.charCodeAt(0)-65:+u;
      }).filter(n=>!isNaN(n)&&n>=0&&n<opts.length);
    } else if(type=='bs'){
      key = String(keyRaw).toUpperCase().split(/[,;]/).map(x=>x.trim()=='B'||x.trim()=='TRUE'||x.trim()=='1');
    } else {
      type = 'esai';
      opts = [];
      key = null;
    }

    const newId = 'Q' + String(Math.max(0, ...S.qs.map(x=>+x.id.slice(1)))+1).padStart(3,'0');
    S.qs.push({
      id: newId,
      subj: mapel,
      type: type,
      text: qText,
      opts: opts,
      key: key,
      diff: diff,
      w: weight,
      exp: exp,
      hist: [new Date().toLocaleString('id-ID') + ' diimpor massal oleh ' + U.name]
    });
    count++;
  });
  return count;
}

/* ===== CTT-ANALYSIS (KHUSUS PORTAL GURU) ===== */
function ctt(eid){
  const R=S.res.filter(r=>r.exam==eid).sort((a,b)=>b.score-a.score),n=R.length,g=Math.max(1,Math.round(n*.27)),up=R.slice(0,g),lo=R.slice(-g),sm=(a,id)=>a.reduce((t,r)=>t+(r.resp[id]||0),0);
  return exOf(eid).qids.map(qOf).filter(q=>q.type!='esai').map(q=>{
    const ok=stat(R,r=>r.resp[q.id]>=1),P=n?ok/n:0,D=(sm(up,q.id)-sm(lo,q.id))/g,pc=Math.min(.98,Math.max(.02,P));
    return{id:q.id,P,D,ok,no:n-ok,tier:P<=.3?'Sukar':P<=.7?'Sedang':'Mudah',c:D>=.4&&P>.3&&P<.71?'Sangat baik':D>=.3?'Baik':D>=.2?'Cukup':D>=.1?'Perlu revisi':'Tidak layak',b:Math.log((1-pc)/pc),a:+(.6+Math.max(0,D)*2).toFixed(2)};
  });
}

function ltS(){
  if(LT.on==1)return;if(LT.on==2){LT.on=1;return toast('Simulasi dilanjutkan')}
  const g=i=>+$('#'+i).value;
  LT={on:1,N:g('lu'),D:Math.max(5,g('ld')),I:Math.max(1,g('li')),Q:g('lq'),X:g('lx'),L:$('#ll').checked,Sb:$('#ls').checked,t:0,ok:0,bad:0,saved:0,fin:0,act:0,rps:0,avg:0,mx:0,er:0,h:{a:[],r:[],e:[]},ra:[],id:setInterval(ltT,500)};
  toast('Simulasi beban dimulai');
}
function ltT(){
  if(LT.on!=1)return;LT.t+=.5;const L=LT,f=L.t/L.D,ramp=Math.min(1,L.L?L.t/3:f/.25),burst=L.Sb&&f>.9?3:1;
  L.act=Math.round(L.N*ramp*(f>.9?1-(f-.9)*5:1));
  L.rps=L.act/L.I*(1+L.X/100)*burst;const u=L.rps/800,req=L.rps*.5,er=Math.min(60,(u>1?(u-1)*60:0)+L.X*.3+Math.random()*.3);
  L.avg=60+400*Math.pow(u,3)+Math.random()*10;L.mx=L.avg*3+Math.random()*50;L.er=er;
  const bad=req*er/100;L.bad+=bad;L.ok+=req-bad;L.saved+=(req-bad);L.fin=f>.9?Math.round(L.N*Math.min(1,(f-.9)*10)*(1-er/100)):0;
  L.ra.push(L.avg);L.h.a.push(L.act);L.h.r.push(L.avg);L.h.e.push(er);ltU();
  if(L.t>=L.D)ltX(1);
}
function ltU(){
  const L=LT,m=$('#lm');if(!m)return;
  m.innerHTML=[['Total VU',L.N||0],['Active VU',L.act||0],['Sukses',Math.round(L.ok||0)],['Gagal',Math.round(L.bad||0)],['Req/dtk',(L.rps||0).toFixed(0)],['Avg resp (ms)',(L.avg||0).toFixed(0)],['Max resp (ms)',(L.mx||0).toFixed(0)],['Error rate',(L.er||0).toFixed(1)+'%'],['Jawaban tersimpan',Math.round(L.saved||0)],['Peserta selesai',L.fin||0]].map(c=>`<div class="card st">${c[0]}<b>${c[1]}</b></div>`).join('');
  $('#lc').innerHTML=`<b>Peserta Aktif (biru) · Response Time ms (oranye) · Error Rate % (merah)</b>${lines([L.h.a,L.h.r,L.h.e],['#2563EB','#F59E0B','#DC2626'])}`;
}
const ltP=()=>{if(LT.on==1){LT.on=2;toast('Dijeda')}};
function ltX(auto){
  if(!LT.id)return;clearInterval(LT.id);LT.id=0;LT.on=0;
  const L=LT,tot=L.ok+L.bad,avg=L.ra.length?L.ra.reduce((a,b)=>a+b,0)/L.ra.length:0,er=tot?L.bad/tot*100:0;
  L.rep={status:auto?'Selesai Otomatis':'Dihentikan',total:Math.round(tot),ok:Math.round(L.ok),bad:Math.round(L.bad),avg:+avg.toFixed(0),er:+er.toFixed(2),vu:L.N,rec:er<1&&avg<300?'Kapasitas beban mencukupi untuk jumlah peserta tersebut.':'Beban melampaui batas: rekomendasikan penambahan node server & cache Redis.'};
  $('#lr').innerHTML=`<b>Hasil &amp; Kesimpulan Simulasi</b><p>Status: ${L.rep.status}<br>Total request: ${L.rep.total} · Berhasil: ${L.rep.ok} · Gagal: ${L.rep.bad}<br>Rata-rata respons: ${L.rep.avg} ms · Error: ${L.rep.er}%<br><b>Rekomendasi:</b> ${L.rep.rec}</p>`;
}
const ltR=()=>{if(LT.id)clearInterval(LT.id);LT={on:0,h:{a:[],r:[],e:[]},t:0};const r=$('#lr');if(r){r.innerHTML='';ltU()}};
const ltD=()=>LT.rep?dl('load_report.json',JSON.stringify(LT.rep,null,2),'application/json'):toast('Jalankan simulasi terlebih dahulu','er');

/* ===== HANDLER MODAL USERS MANAGEMENT ===== */
function modalTambahUser(){
  frm('Tambah Pengguna Baru', [
    { k: 'role', l: 'Role Akun', t: 'select', o: ['admin', 'guru', 'siswa'], v: 'guru' },
    { k: 'name', l: 'Nama Lengkap', req: 1 },
    { k: 'user', l: 'Username Login (tanpa spasi)', req: 1 },
    { k: 'pw', l: 'Password Login', t: 'password', req: 1 },
    { k: 'contact', l: 'Email atau Nomor WhatsApp / Telepon' }
  ], v => {
    const usr = v.user.trim().toLowerCase();
    if(S.users.some(u => u.user.toLowerCase() === usr) || S.stu.some(s => (s.user||s.nis).toLowerCase() === usr)){
      return 'Username "'+usr+'" sudah digunakan oleh pengguna lain';
    }
    if(v.role === 'siswa'){
      const newStu = {
        id: 'S' + Date.now(),
        nis: usr,
        name: v.name.trim(),
        user: usr,
        pw: hash(v.pw),
        wa: v.contact.trim(),
        pilihanBelajar: 'Online',
        status: 'Aktif',
        cls: S.classes.length ? S.classes[0].name : 'Umum',
        motto: 'Belajar dengan tekun dan semangat.'
      };
      S.stu.push(newStu);
    } else {
      const newUser = {
        id: (v.role === 'admin' ? 'A' : 'G') + Date.now(),
        role: v.role,
        name: v.name.trim(),
        user: usr,
        pw: hash(v.pw),
        email: v.contact.trim(),
        tel: v.contact.trim(),
        status: 'Aktif'
      };
      S.users.push(newUser);
    }
    sv0();
    lg('Tambah user baru: ' + v.name + ' (' + v.role + ')');
    toast('User ' + v.name + ' berhasil ditambahkan');
    go('set');
  });
}

function modalEditUser(id, isStu){
  const target = isStu ? S.stu.find(s => s.id === id) : S.users.find(u => u.id === id);
  if(!target) return toast('User tidak ditemukan', 'er');

  frm('Edit Akun Pengguna', [
    { k: 'name', l: 'Nama Lengkap', v: target.name, req: 1 },
    { k: 'user', l: 'Username Login', v: target.user || target.nis, req: 1 },
    { k: 'contact', l: 'Email / Nomor HP / WA', v: isStu ? (target.wa || '-') : (target.email || target.tel || '') },
    { k: 'status', l: 'Status Akun', t: 'select', o: ['Aktif', 'Nonaktif'], v: target.status || 'Aktif' }
  ], v => {
    const usr = v.user.trim().toLowerCase();
    const isConflict = (S.users.some(u => u.user.toLowerCase() === usr && u.id !== id) ||
                        S.stu.some(s => (s.user||s.nis).toLowerCase() === usr && s.id !== id));
    if(isConflict) return 'Username "'+usr+'" sudah digunakan oleh akun lain';

    target.name = v.name.trim();
    target.user = usr;
    target.status = v.status;
    if(isStu){
      target.wa = v.contact.trim();
    } else {
      target.email = v.contact.trim();
      target.tel = v.contact.trim();
    }
    sv0();
    lg('Edit akun user ' + target.name);
    toast('Data user berhasil diperbarui');
    go('set');
  });
}

function modalUbahPasswordUser(id, isStu){
  const target = isStu ? S.stu.find(s => s.id === id) : S.users.find(u => u.id === id);
  if(!target) return toast('User tidak ditemukan', 'er');

  frm('Ubah Password User: ' + target.name, [
    { k: 'pw', l: 'Password Baru', t: 'password', req: 1 }
  ], v => {
    if(v.pw.length < 4) return 'Password minimal 4 karakter';
    target.pw = hash(v.pw);
    sv0();
    lg('Ganti password user ' + target.name);
    toast('Password ' + target.name + ' berhasil diubah');
    go('set');
  });
}

function hapusUser(id, isStu){
  if(id === U.id) return toast('Tidak dapat menghapus akun Anda sendiri yang sedang aktif!', 'er');
  const target = isStu ? S.stu.find(s => s.id === id) : S.users.find(u => u.id === id);
  if(!target) return toast('User tidak ditemukan', 'er');

  ask(`Hapus akun pengguna <b>${esc(target.name)}</b> (${target.role || 'siswa'})?`, () => {
    if(isStu){
      S.stu = S.stu.filter(s => s.id !== id);
    } else {
      S.users = S.users.filter(u => u.id !== id);
    }
    sv0();
    lg('Hapus user ' + target.name);
    toast('User ' + target.name + ' berhasil dihapus');
    go('set');
  });
}

const pv=()=>{
  if($('#s_c1')) document.documentElement.style.setProperty('--p',$('#s_c1').value);
  if($('#s_c2')) document.documentElement.style.setProperty('--s',$('#s_c2').value);
};

function onColorChangeLive(key, val){
  val = String(val).trim();
  if(!val.startsWith('#') && /^[0-9A-Fa-f]{6}$/.test(val)) val = '#' + val;
  const picker = $('#thm_' + key);
  const txt = $('#thm_' + key + '_txt');
  if(picker && picker.value !== val && /^#[0-9A-Fa-f]{6}$/.test(val)) picker.value = val;
  if(txt && txt.value !== val) txt.value = val;

  const map = {
    primary: '--p',
    secondary: '--s',
    accent: '--o',
    green: '--a',
    bodyBg: '--bg',
    cardBg: '--cd',
    text: '--tx',
    border: '--bd',
    warning: '--wn',
    danger: '--er'
  };
  const prop = map[key];
  if(prop){
    document.documentElement.style.setProperty(prop, val);
    if(key === 'green') document.documentElement.style.setProperty('--ok', val);
    if(key === 'bodyBg' && document.body && document.documentElement.dataset.t !== 'dark'){
      document.body.style.backgroundColor = val;
    }
  }
}

function simpanTemaWarna(){
  if(!S.theme) S.theme = {};
  const keys = ['primary','secondary','accent','green','bodyBg','cardBg','text','border','warning','danger'];
  keys.forEach(k => {
    const el = $('#thm_'+k);
    if(el) S.theme[k] = el.value;
  });
  if(S.school){
    S.school.c1 = S.theme.primary;
    S.school.c2 = S.theme.secondary;
  }
  sv0();
  applyTheme();
  lg('Memperbarui tema warna sistem');
  toast('Tema warna berhasil disimpan dan diterapkan!');
  go('set');
}
